name: CI

on:
  push:
    branches: [main]
    # Every module here is released by its own prefixed tag; the library's
    # 'v*' matches none of the others, and a nested-module tag that CI ignores
    # is how the analysis module went unreleased across every library release
    # after v0.4.0 before a consumer noticed. See docs/decisions.md, "The
    # analysis module went unreleased for every library release after
    # v0.4.0".
    tags: ['v*', 'analysis/v*', 'failsafeown/v*', 'benchmarks/v*', 'teleos/v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The analyzer is built once and reused by every vet step below.
  VELOCITYVET: ${{ github.workspace }}/bin/velocityvet

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache-dependency-path: |
            go.sum
            analysis/go.sum
            benchmarks/go.sum
            failsafeown/go.sum
            teleos/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: |
          go vet ./...
          go -C analysis vet ./...
          go -C benchmarks vet ./...
          go -C failsafeown vet ./...
          go -C teleos vet ./...

      # The toolchain floats on 1.27.x, but staticcheck pins its own:
      # 2026.2.1's export-data reader stops at version 4, and 1.27.2's
      # stdlib writes version 5. GOTOOLCHAIN hands the step a 1.27.1
      # GOROOT whose export data it can read, analyzing a module that
      # still targets the same language version. Bump the pin when
      # staticcheck ships a reader for the new format.
      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false
        env:
          GOTOOLCHAIN: go1.27.1

      # Whitespace style, via golangci-lint's bundled wsl_v5, with its default
      # set. See .golangci.yml for what is on and why. Installed here rather
      # than through the action because the same binary has to run over the
      # submodules, which the action does not reach: they are separate modules,
      # ./... from the root does not include them, and `go -C` cannot invoke a
      # non-go binary, so each is run from a subshell.
      - name: install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: wsl
        run: |
          golangci-lint run ./...
          (cd failsafeown && golangci-lint run ./...)
          (cd analysis && golangci-lint run ./...)
          (cd benchmarks && golangci-lint run ./...)
          (cd teleos && golangci-lint run ./...)

      # velocity's own analyzer, over both modules that use the library.
      - name: lostrelease
        run: |
          go -C analysis build -o "$VELOCITYVET" ./cmd/velocityvet
          go vet -vettool="$VELOCITYVET" ./...
          go -C benchmarks vet -vettool="$VELOCITYVET" ./...
          go -C failsafeown vet -vettool="$VELOCITYVET" ./...

      - name: test
        run: |
          go test ./...
          go -C analysis test ./...
          go -C failsafeown test ./...
          go -C teleos test ./...

      - name: test -race
        run: |
          go test -race -count=2 ./...
          go -C failsafeown test -race ./...
          go -C teleos test -race -count=2 ./...

      # failsafeown pins a released velocity, so its own tests cannot catch a
      # working-tree change to ownership that breaks it. Run it once more
      # against this checkout; the edit is not committed.
      - name: failsafeown against the working tree
        run: |
          go -C failsafeown mod edit -replace github.com/apsis-io/velocity=..
          go -C failsafeown test ./...
          git -C failsafeown checkout go.mod

      # teleos pins a released velocity for the same reason failsafeown does;
      # a working-tree change to async or dedupe that breaks it cannot be
      # caught by its own tests against the pin.
      - name: teleos against the working tree
        run: |
          go -C teleos mod edit -replace github.com/apsis-io/velocity=..
          go -C teleos test ./...
          git -C teleos checkout go.mod

      # Leak diagnostics for advanced borrows only compile under this tag.
      - name: test -tags=velocitydebug
        run: go test -tags=velocitydebug -race ./...

      - name: examples
        run: |
          go test ./... -run Example
          go -C teleos test ./... -run Example

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache-dependency-path: go.sum
      # The seed corpus in testdata runs under `go test`; this is the
      # randomized pass, kept short enough for every push.
      - name: fuzz the ownership model
        run: go test ./ownership -run '^$' -fuzz '^FuzzOwnershipModel$' -fuzztime 60s
      # async is the package consumers actually use, and until this target
      # existed it was the one concurrency package here with no randomized
      # coverage at all.
      - name: fuzz the errgroup model
        run: go test ./async -run '^$' -fuzz '^FuzzErrGroupModel$' -fuzztime 60s
      - name: upload crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus
          path: |
            ownership/testdata/fuzz/
            async/testdata/fuzz/

  benchmarks:
    # Comparison benchmarks are a separate module and are not run for their
    # numbers here — CI machines are too noisy — only to keep them building.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache-dependency-path: benchmarks/go.sum
      - name: compile benchmarks
        run: |
          go test ./... -run '^$' -bench . -benchtime 1x
          go -C benchmarks test ./... -run '^$' -bench . -benchtime 1x
          go -C teleos test ./... -run '^$' -bench . -benchtime 1x
